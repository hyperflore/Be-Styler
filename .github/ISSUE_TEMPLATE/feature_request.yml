name: Feature request
description: Suggest a new plugin, theme option or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like?
      description: Describe the feature and the problem it solves.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: rules
    attributes:
      label: Checks
      options:
        - label: This doesn't unlock paid Discord features or send data to third parties.
          required: true
